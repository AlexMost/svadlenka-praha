# Builds the site from the CRM price list and opening hours and deploys it to
# the gh-pages branch. Started by the CRM (workflow_dispatch on «Publikovat» and
# nightly at 00:05 Prague, which drops passed opening-hours exceptions) and by
# every push to main. The file name is a constant in the CRM: do not rename it.
name: publish

on:
  workflow_dispatch:
  # No paths-ignore: a hand-edited .po pushed to main must publish too. The
  # .po commit-back below cannot loop: a push made with GITHUB_TOKEN never
  # starts a workflow run, and its message carries [skip ci].
  push:
    branches: [main]

permissions:
  contents: write # push gh-pages + commit translated .po files back to main

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # Keep the write token out of .git/config, so npm scripts and msgai
          # never see it; the two pushes below pass it explicitly.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run test:unit

      # Fails the run on an unreachable CRM or an empty/invalid price list or
      # opening hours.
      - run: npm run fetch-crm

      - run: npm run update-translations

      # If OpenAI is down the site still publishes; new strings show their
      # Czech text until the next run translates them.
      - run: npm run translate
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - run: rm -rf public && mkdir public && npm run build-prod

      - run: npx playwright test

      # The bot identity goes through git config, not `gh-pages -u`: that option
      # parses an RFC 5322 address, and the `[bot]` in the noreply local part
      # is not valid there (the first run failed on it). gh-pages pushes from
      # its own cache clone, so the config must be global.
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx gh-pages -d public --silent \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Last, so a git race on main never blocks a publish.
      - name: Commit translations back to main
        run: |
          git diff --quiet -- i18n || (
            git add i18n &&
            git commit -m "chore(i18n): translate new site strings [skip ci]" &&
            git pull --rebase origin main &&
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          )
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
